[project]
name = "game2048"
version = "0.1.0"
description = "2048 with a Python rules engine, a gym-style training env, and a web UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
train = [
    "numpy>=1.26",
    "torch>=2.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["game2048"]

[tool.pytest.ini_options]
testpaths = ["tests"]
