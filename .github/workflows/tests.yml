name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # No PyTorch here: the CNN baseline's tests skip without it, and the rest
      # (rules, server, C engine, n-tuple training and search) need only numpy and cc.
      - run: uv sync --extra dev
      - run: uv run pytest -q
